<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>u ้ o ง | ป ร ม</title>
    <!-- FontAwesome ไอคอนโซเชียลและเครื่องเล่นเพลง -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- วิดีโอพื้นหลัง -->
    <video autoplay loop muted playsinline class="video-bg">
        <source src="snaptik_7679024904334740757_v3.mp4" type="video/mp4">
    </video>
    <div class="background-overlay"></div>

    <!-- Canvas เอฟเฟกต์หิมะตก -->
    <canvas id="snow-canvas"></canvas>

    <!-- การ์ดโปรไฟล์หลัก -->
    <div class="profile-card">
        
        <!-- ส่วนรูปโปรไฟล์และกรอบกะโหลก -->
        <div class="profile-img-container">
            <img src="avatar.jpg" alt="Profile" class="profile-img">
            <img src="frame.png" alt="Frame" class="avatar-frame">
        </div>

        <!-- ชื่อโปรไฟล์สีรุ้ง -->
        <h1 class="username">Мневсеещенужнадевушка</h1>

        <!-- ไอคอนโซเชียลมีเดีย -->
        <div class="social-icons">
            <a href="#" target="_blank" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
            <a href="#" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" target="_blank" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
            <a href="#" target="_blank" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
        </div>

        <!-- เครื่องเล่นเพลง (Music Player UI) -->
        <div class="music-player-ux">
            <img src="song-cover.jpg" alt="Song Cover" class="song-cover">
            
            <div class="song-details">
                <span class="song-title">loading - central cee</span>
                
                <!-- แถบเล่นเพลง -->
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>

                <!-- ปุ่มควบคุมและเวลา -->
                <div class="controls-wrapper">
                    <div class="main-buttons">
                        <button class="ctrl-btn" id="prev-btn" aria-label="Previous"><i class="fa-solid fa-backward-step"></i></button>
                        <button class="ctrl-btn play-btn-main" id="play-btn" aria-label="Play/Pause"><i class="fa-solid fa-play" id="play-icon"></i></button>
                        <button class="ctrl-btn" id="next-btn" aria-label="Next"><i class="fa-solid fa-forward-step"></i></button>
                    </div>
                    <div class="time-display">
                        <span id="current-time">0:00</span> / <span id="duration">0:00</span>
                    </div>
                </div>
            </div>

            <!-- แท็ก Audio -->
            <audio id="audio-player" preload="metadata"></audio>
        </div>

        <!-- ====================================================
             ส่วนเพิ่มใหม่: Mario Pixel Stage ด้านล่างการ์ด
             ==================================================== -->
        <div class="mario-stage">
            <div class="mario-block">?</div>
            <div class="mario-character"></div>
            <div class="mario-mushroom"></div>
            <div class="mario-ground"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
