<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="prem.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nongprem ❄</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <video autoplay loop muted playsinline class="video-bg" id="bg-video">
        <source src="ILLSLICK - ตีหนึ่งที่คูเมือง [Official Video].mp4" type="video/mp4" id="video-source">
    </video>

    <div class="background-overlay"></div>

    <canvas id="snow-canvas"></canvas>

    <div class="profile-card">
        
        <div class="profile-img-container">
            <img src="IMG_4618.jpeg" alt="profile" class="profile-img">
            
            <svg class="discord-orbs-frame" viewBox="0 0 100 100">
                <defs>
                    <linearGradient id="orbGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00f2fe" />
                        <stop offset="100%" stop-color="#4facfe" />
                    </linearGradient>
                    <linearGradient id="orbGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#000000" stop-opacity="0" />
                        <stop offset="100%" stop-color="#00f2fe" />
                    </linearGradient>
                </defs>

                <circle cx="50" cy="50" r="44" class="orb-ring ring-1" />
                <circle cx="50" cy="50" r="44" class="orb-ring ring-2" />
                <circle cx="50" cy="50" r="44" class="orb-ring ring-3" />
                
                <g class="orbs-group">
                    <circle cx="50" cy="6" r="4" class="orb-head" />
                    <circle cx="94" cy="50" r="3" class="orb-head" />
                    <circle cx="50" cy="94" r="3.5" class="orb-head" />
                </g>
            </svg>
        </div>

        <h1 class="username">u ้ อ ง l ป ร ม</h1>

        <div class="social-icons">
            <a href="https://discord.gg/h8euBk8YPW" target="_blank"><i class="fab fa-discord"></i></a>
            <a href="https://www.instagram.com/punnawit.tz" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.youtube.com/@nongpremchie" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://www.facebook.com/share/1FK2bHWbWw/?mibextid=wwXIfr" target="_blank"><i class="fab fa-facebook"></i></a>
        </div>

        <div class="music-player-ux">
            <img src="songcover.jpg" alt="song cover" class="song-cover" id="song-cover">
            <div class="song-details">
                <span class="song-title" id="song-title">กำลังโหลด...</span>
                
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress"></div>
                </div>

                <div class="controls-wrapper">
                    <span class="time-display" id="current-time">0:00</span>
                    
                    <div class="main-buttons">
                        <button class="ctrl-btn" id="prev-btn" title="เพลงก่อนหน้า">
                            <i class="fas fa-backward-step"></i>
                        </button>
                        <button class="ctrl-btn play-btn-main" id="play-btn">
                            <i class="fas fa-play" id="play-icon"></i>
                        </button>
                        <button class="ctrl-btn" id="next-btn" title="เพลงถัดไป">
                            <i class="fas fa-forward-step"></i>
                        </button>
                    </div>

                    <span class="time-display" id="duration">0:00</span>
                </div>
            </div>
        </div>

        <audio id="audio"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
